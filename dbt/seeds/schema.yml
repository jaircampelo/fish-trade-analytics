seeds:
  - name: seed_product_categories
    description: "Descriptions from heading codes (SH4 codes), extracted from auxiliary tables at COMEX STAT."
    config:
      delimiter: ";"
      tags: ["SH4", "Category"]
    columns:
      - name: product_category_id
        description: "ID for SH4 heading codes."
        data_tests:
          - unique
          - not_null
      - name: product_category_name
        description: "Names of SH4 heading codes."
        data_tests:
          - unique
          - not_null
      - name: product_category_description
        description: "Detail description of SH4 heading codes."
        data_tests:
          - unique
          - not_null

  - name: seed_state_regions
    description: "Add a column of the regions from each Brazil state."
    config:
      delimiter: ","
      tags: ["Regions", "Brazil"]
    columns:
      - name: uf
        description: "Two-letter codes from Brazil states."
        data_tests:
          - unique
          - not_null
      - name: region
        description: "Regions of each Brazil state."
        data_tests:
          - not_null