name: 'fish_trade_analytics'
version: '1.0.0'
config-version: 2

profile: 'fish_trade_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "create extension if not exists unaccent"

models:
  fish_trade_analytics:
    silver:
      +materialized: incremental
      +schema: silver
      +tags: ["silver", "transform", "clean"]
      +on_schema_change: "append_new_columns"
      +docs:
        node_color: "#10477E"

    gold:
      +materialized: incremental
      +schema: gold
      +tags: ["gold", "aggregated"]
      +on_schema_change: "append_new_columns"
      +docs:
        node_color: "#FFD700"

seeds:
  fish_trade_analytics:
    seed_product_categories:
      +delimiter: ";"
      +schema: bronze
      +column_types:
        product_category_id: char(4)
        product_category_name: varchar(100)
        product_category_description: text
      +docs:
        node_color: "#BBC1C7"