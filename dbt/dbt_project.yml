name: 'fish_trade_analytics'
version: '1.0.0'

profile: 'fish_trade_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "create extension if not exists unaccent"

models:
  fish_trade_analytics:
    silver:
      +materialized: incremental
      +schema: silver
      +tags: ["silver", "transform", "clean"]
      +on_schema_change: "append_new_columns"

    gold:
      +materialized: incremental
      +schema: gold
      +tags: ["gold", "aggregated"]
      +on_schema_change: "append_new_columns"